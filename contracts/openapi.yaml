    # ---------- 采集上传（四步协议） ----------
    UploadDeclareRequest:
      type: object
      additionalProperties: false
      description: |
        声明 DTO。写入拒绝未声明字段（`additionalProperties: false`），未知字段返回 422 `VALIDATION_FAILED`。
        声明体 >64KiB 返回 413；1–12 图；单图 ≤20MiB；合计 ≤120MiB（JSON Schema 只能表达单图上限，清单求和与 image_id 唯一性由实现校验）。
      required: [sample_id, schema_version, cultivar_id, part, class_id, images]
      properties:
        batch_id: {type: [string, "null"], maxLength: 64}
        latitude: {type: [number, "null"], minimum: -90, maximum: 90}
        longitude: {type: [number, "null"], minimum: -180, maximum: 180}
        location_accuracy_m: {type: [number, "null"], minimum: 0}
        sample_id: { $ref: "#/components/schemas/Id" }
        schema_version:
          type: integer
          const: 1
          description: 声明格式版本；当前仅接受 1
        tree_id: { type: [string, "null"], maxLength: 64 }
        cultivar_id: { $ref: "#/components/schemas/Code" }
        part: { $ref: "#/components/schemas/Part" }
        class_id: { $ref: "#/components/schemas/Code" }
        symptoms: { type: [string, "null"], maxLength: 500 }
        note: { type: [string, "null"], maxLength: 500 }
        images:
          type: array
          minItems: 1
          maxItems: 12
          description: 固定清单，声明后不可增删改；image_id 在清单内唯一（实现校验），按声明顺序回显
          items: { $ref: "#/components/schemas/UploadDeclaredImage" }
    UploadDeclaredImage:
      type: object
      additionalProperties: false
      description: 每图声明项；全部字段参与同 sample_id 重放的规范化内容比较。
      required: [image_id, view_type, captured_at, device_timezone, device_model, mime_type, width, height, file_size, sha256]
      properties:
        image_id: { $ref: "#/components/schemas/Id" }
        view_type: { $ref: "#/components/schemas/ViewType" }
        captured_at:
          type: string
          format: date-time
          description: RFC3339 且必须带时区（Z 或 ±hh:mm）；无偏移的本地时间拒绝
        device_timezone:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z][A-Za-z0-9_+\\-]*(/[A-Za-z0-9_+\\-]+)*$"
          description: IANA 时区名（如 Asia/Shanghai）；是否真实存在由实现校验
        device_model: { type: [string, "null"], maxLength: 64, description: 无法获取时显式传 null }
        mime_type: { type: string, enum: [image/jpeg, image/png, image/webp] }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
        file_size:
          type: integer
          minimum: 1
          maximum: 20971520
          description: 单图 ≤20MiB（20971520 字节）；合计上限 120MiB 由实现按清单求和校验
        sha256:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: 原图字节的 SHA256，64 位小写十六进制；PUT 的 X-Content-SHA256 必须与之一致
    UploadStatus:
      type: object
      description: |
        上传会话状态。`received_images`/`missing_images`/`invalid_images` 互斥，并集等于声明清单（按声明顺序）；
        `state=complete` 后三集合固定为全部 received。`invalid_images` 记录校验失败待重传的 image_id。
      required: [upload_id, sample_id, state, declared_at, received_images, missing_images, invalid_images]
      properties:
        upload_id: { $ref: "#/components/schemas/Id" }
        sample_id: { $ref: "#/components/schemas/Id" }
        state: { $ref: "#/components/schemas/UploadState" }
        declared_at: { type: string, format: date-time, description: 服务端记录的声明时间（UTC） }
        received_images:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
        missing_images:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
        invalid_images:
          type: array
          uniqueItems: true
          items: { $ref: "#/components/schemas/Id" }
    UploadImageReceipt:
      type: object
      required: [upload_id, image_id, receive_status, sha256, file_size]
      description: 单图接收回执；只表示字节完整，人工质量仍为 pending，与 SampleImage.quality_status 无关。
      properties:
        upload_id: { $ref: "#/components/schemas/Id" }
        image_id: { $ref: "#/components/schemas/Id" }
        receive_status:
          type: string
          const: received
          description: 本接口成功仅返回 received；missing/invalid 只出现在 UploadStatus 集合中
        sha256: { type: string, pattern: "^[0-9a-f]{64}$" }
        file_size: { type: integer, minimum: 1, maximum: 20971520 }
    UploadCompleteResponse:
      type: object
      required: [upload_id, sample_id, state, upload_completed_at, image_count]
      description: 完成回执；重复调用返回相同 upload_id/sample_id/state，upload_completed_at 保持首次完成时间。
      properties:
        upload_id: { $ref: "#/components/schemas/Id" }
        sample_id: { $ref: "#/components/schemas/Id" }
        state: { type: string, const: complete }
        upload_completed_at: { type: string, format: date-time, description: 首次完成时间（UTC），重放不变 }
        image_count: { type: integer, minimum: 1, maximum: 12 }

