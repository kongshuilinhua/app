        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreateRequest" }
      responses:
        "201":
          description: 新建账号与一次性临时密码
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserCreateResponse" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/users/{user_id}:
    patch:
      tags: [users]
      operationId: updateUser
      summary: 改名/角色/启停（无硬删除）
      parameters:
        - { $ref: "#/components/parameters/UserIdParam" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserPatchRequest" }
      responses:
        "200":
          description: 更新后的账号
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /admin/users/{user_id}/reset-password:
    post:
      tags: [users]
      operationId: resetPassword
      summary: 重置密码（一次性返回临时密码）
      parameters:
        - { $ref: "#/components/parameters/UserIdParam" }
      responses:
        "200":
          description: 一次性临时密码
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResetPasswordResponse" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # ---------------- 审计 ----------------
  /admin/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: 审计查询（只读）
      parameters:
        - name: object_type
          in: query
          schema: { type: string }
        - name: object_id
          in: query
          schema: { type: string }
        - name: actor_id
          in: query
          schema: { type: string }
        - name: action
          in: query
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: 审计记录
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditPage" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # ---------------- 专家工单（F2 / M2） ----------------
  /expert/tickets:
    get:
      tags: [expert-tickets]
      operationId: listTickets
      summary: 工单队列
      parameters:
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/TicketStatus" }
        - name: assignee
          in: query
          schema: { type: string, enum: [me, unassigned, all] }
          description: 本人 / 未分配 / 全部
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: 工单队列
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketSummaryPage" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /expert/tickets/{ticket_id}:
    get:
      tags: [expert-tickets]
      operationId: getTicket
      summary: 工单详情
      parameters:
        - { $ref: "#/components/parameters/TicketIdParam" }
      responses:
        "200":
          description: 工单详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /expert/tickets/{ticket_id}/claim:
    post:
      tags: [expert-tickets]
      operationId: claimTicket
      summary: 领取工单
      parameters:
        - { $ref: "#/components/parameters/TicketIdParam" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketActionRequest" }
      responses:
        "200":
          description: 领取后的工单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionOrStateConflict" }
  /expert/tickets/{ticket_id}/draft:
    post:
      tags: [expert-tickets]
      operationId: saveTicketDraft
      summary: 保存答复草稿
      parameters:
        - { $ref: "#/components/parameters/TicketIdParam" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketDraftRequest" }
      responses:
        "200":
          description: 保存后的工单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionOrStateConflict" }
  /expert/tickets/{ticket_id}/request-info:
    post:
      tags: [expert-tickets]
      operationId: requestTicketInfo
      summary: 要求补充
      parameters:
        - { $ref: "#/components/parameters/TicketIdParam" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketRequestInfoRequest" }
      responses:
        "200":
          description: 更新后的工单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionOrStateConflict" }
  /expert/tickets/{ticket_id}/answer:
    post:
      tags: [expert-tickets]
      operationId: answerTicket
      summary: 发布答复
      parameters:
        - { $ref: "#/components/parameters/TicketIdParam" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketAnswerRequest" }
      responses:
        "200":
          description: 答复后的工单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionOrStateConflict" }
  /expert/tickets/{ticket_id}/unresolve:
    post:
      tags: [expert-tickets]
      operationId: unresolveTicket
      summary: 说明无法判断
      parameters:
        - { $ref: "#/components/parameters/TicketIdParam" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TicketUnresolveRequest" }
      responses:
        "200":
          description: 更新后的工单
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TicketDetail" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionOrStateConflict" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 服务端不透明访问令牌（非 JWT）

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: 可复用幂等键（UUIDv7）；作用域见 03 篇第 8 节，重放窗口 24 小时
      schema: { type: string, format: uuid }
    UploadState:
      name: upload_state
      in: query
      description: 首版审核列表仅支持 complete；采集端接收中状态通过 GET /uploads/{upload_id} 查询。
      schema: { type: string, enum: [complete], default: complete }
    ReviewStatus:
      name: review_status
      in: query
      description: 多值用逗号分隔
      schema: { type: string }
    Excluded:
      name: excluded
      in: query
      schema: { type: boolean }
    FinalCultivarId:
      name: final_cultivar_id
      in: query
      schema: { type: string }
    FinalClassId:
      name: final_class_id
      in: query
      schema: { type: string }
    UploadedFrom:
      name: uploaded_from
      in: query
      description: 北京时间整日 YYYY-MM-DD，左闭右开
      schema: { type: string, format: date }
    UploadedTo:
      name: uploaded_to
      in: query
      schema: { type: string, format: date }
    SampleQ:
      name: q
      in: query
      description: sample_id 精确或 tree_id 前缀
      schema: { type: string, maxLength: 36 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    SampleId:
      name: sample_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ImageId:
      name: image_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ExportId:
      name: export_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    CultivarIdParam:
      name: cultivar_id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
    ClassIdParam:
      name: class_id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z][a-z0-9_]{1,31}$" }
    UserIdParam:
      name: user_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketIdParam:
      name: ticket_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    UploadId:
      name: upload_id
      in: path
      required: true
      schema: { $ref: "#/components/schemas/Id" }
    ContentSha256:
      name: X-Content-SHA256
      in: header
      required: true
      description: 请求体原始字节的 SHA256，64 位小写十六进制；必须与声明中该 image_id 的 sha256 一致
      schema: { type: string, pattern: "^[0-9a-f]{64}$" }
    ContentLength:
      name: Content-Length
      in: header
      required: true
      description: 请求体字节数；必须与声明中该 image_id 的 file_size 一致
      schema: { type: integer, minimum: 1, maximum: 20971520 }

  responses:
    AuthRequired:
      description: 缺少令牌
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    AuthInvalid:
      description: 账号密码错误或令牌无效/过期
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Forbidden:
      description: 无权限执行该操作
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    NotFound:
      description: 资源不存在或不可见
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    ValidationFailed:
      description: 字段校验失败
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    VersionConflict:
      description: 版本冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    StateConflict:
      description: 状态不允许该操作
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    VersionOrStateConflict:
      description: 版本或状态冲突
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    IdempotencyConflict:
      description: 同一幂等键（或同一 sample_id 的声明）对应不同内容
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    FileMismatch:
      description: |
        `error.code=FILE_MISMATCH`：字节长度/SHA256/文件签名与声明不符，或该 image_id 已接收不同字节。
        同一 409 槽位也可能返回 `error.code=STATE_CONFLICT`（上传已 complete，或 image_id 不在声明的固定清单内），错误体形状相同。
        `details` 可能含 image_id、expected_sha256、actual_sha256。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    MissingImages:
      description: |
        `error.code=MISSING_IMAGES`：声明的图片仍有未收到或无效项，complete 被拒绝且不产生完成回执。
        `details.missing`、`details.invalid` 为 image_id 数组。
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    PayloadTooLarge:
      description: "`error.code=PAYLOAD_TOO_LARGE`：声明体 >64KiB，或单图 >20MiB、合计 >120MiB"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    UnsupportedMedia:
      description: "`error.code=UNSUPPORTED_MEDIA`：Content-Type 或文件签名不是 JPEG/PNG/WebP，或与声明 mime_type 不符"
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    RateLimited:
      description: 限流
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    Unavailable:
      description: 依赖暂不可用
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }

  schemas:
    Action:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        detail:
          type: string
          maxLength: 3000
          minLength: 1
          title: Detail
      type: object
      required:
      - title
      - detail
      title: Action
    Advice:
      properties:
        status:
          type: string
          enum:
          - matched
          - uncertain
          - healthy
          - unmapped
          - conflict
          - unavailable
          title: Status
        title:
          type: string
          title: Title
        message:
          type: string
          title: Message
        actions:
          items:
            $ref: '#/components/schemas/Action'
          type: array
          title: Actions
        sources:
          items:
            $ref: '#/components/schemas/Source'
          type: array
          title: Sources
        version:
          anyOf:
          - type: string
          - type: 'null'
          title: Version
      type: object
      required:
      - status
      - title
      - message
      title: Advice
    Candidate:
      properties:
        label:
          type: string
          maxLength: 100
          minLength: 1
          title: Label
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
        score:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Score
        class_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Class Id
      type: object
      required:
      - label
      - name
      - score
      title: Candidate
    DiagnosisOut:
      properties:
        recognition:
          $ref: '#/components/schemas/RecognitionOut'
        advice:
          $ref: '#/components/schemas/Advice'
        receipt:
          type: string
          title: Receipt
      type: object
      required:
      - recognition
      - advice
      - receipt
      title: DiagnosisOut
    RecognitionOut:
      properties:
        image_id:
          type: string
          title: Image Id
        sha256:
          type: string
          title: Sha256
        model:
          type: string
          title: Model
        model_version:
          type: string
          title: Model Version
        scope:
          type: string
          title: Scope
        candidates:
          items:
            $ref: '#/components/schemas/Candidate'
          type: array
          maxItems: 5
          minItems: 1
          title: Candidates
        warning:
          type: string
          title: Warning
        created_at:
          type: string
          title: Created At
      type: object
      required:
      - image_id
      - sha256
      - model
      - model_version
      - scope
      - candidates
      - warning
      - created_at
      title: RecognitionOut
    RetryIn:
      properties:
        receipt:
          type: string
          maxLength: 24000
          minLength: 1
          title: Receipt
      additionalProperties: false
      type: object
      required:
      - receipt
      title: RetryIn
    Source:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          title: Title
        url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Url
      type: object
      required:
      - title
      - url
      title: Source
    # ---------- 通用 ----------
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: object
              additionalProperties: true
            request_id: { type: string, format: uuid }

    HealthResponse:
      type: object
      required: [status, version, time]
      properties:
        status: { type: string }
        version: { type: string }
        time: { type: string, format: date-time }

    Id:
      type: string
      format: uuid
      pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-7[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$"
    Code:
      type: string
      pattern: "^[a-z][a-z0-9_]{1,31}$"

    # ---------- 枚举 ----------
    Role:
      type: string
      enum: [collector, admin, super_admin, expert]
    AdminRole:
      type: string
      description: 训练准备管理角色；Web 登录角色见 Role。
      enum: [admin, super_admin]
    ReviewStatus:
      type: string
      enum: [unreviewed, confirmed, corrected, unresolved]
    QualityStatus:
      type: string
      enum: [pending, usable, unusable]
    QualityReasonCode:
      type: string
      enum: [blur, occluded, exposure, wrong_object, duplicate, other]
    ViewType:
      type: string
      enum: [close_up, context, other]
    Part:
      type: string
      enum: [leaf, fruit, branch, insect, other]
    UploadState:
      type: string
      enum: [receiving, complete]
    ExportStatus:
      type: string
      enum: [queued, running, succeeded, failed]
    QuestionStatus:
      type: string
      enum: [processing, auto_answered, queued, reviewing, needs_info, expert_answered, expert_unresolved, answer_failed]
    TicketStatus:
      type: string
      enum: [queued, reviewing, needs_info, done]
    TicketOutcome:
      type: string
      enum: [answered, unresolved]
    ConfidenceBand:
      type: string
      enum: [high, medium, low, unknown]
    RoutingReasonCode:
      type: string
      enum: [evidence_sufficient, insufficient_evidence, out_of_scope, conflict, low_confidence, model_unavailable, policy_force_expert]

    # ---------- 认证 ----------
    ProfileResponse:
      type: object
      required: [user_id, username, display_name, role, phone_verified]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
        phone_masked: { type: [string, "null"], description: 脱敏手机号；旧账号尚未回填时可为空 }
        phone_verified: { type: boolean }
    ProfilePatch:
      type: object
      additionalProperties: false
      required: [display_name]
      properties:
        display_name: { type: string, minLength: 2, maxLength: 18 }
    PhoneCodeRequest:
      type: object
      additionalProperties: false
      required: [phone]
      properties:
        phone: { type: string, maxLength: 16, description: 中国内地手机号，可带+86前缀 }
    PhoneCodeResponse:
      type: object
      required: [challenge_id, resend_after_seconds, expires_in]
      properties:
        challenge_id: { type: string }
        resend_after_seconds: { type: integer, const: 60 }
        expires_in: { type: integer, const: 300 }
    PhoneLoginRequest:
      type: object
      additionalProperties: false
      required: [phone, challenge_id, code]
      properties:
        phone: { type: string, maxLength: 16 }
        challenge_id: { type: string, minLength: 32, maxLength: 100 }
        code: { type: string, pattern: '^[0-9]{6}$', writeOnly: true }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    AuthUser:
      type: object
      required: [user_id, username, display_name, role]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }
    LoginResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in, user]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer }
        user: { $ref: "#/components/schemas/AuthUser" }
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }
    RefreshResponse:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer }
    MeResponse:
      type: object
      required: [user_id, username, display_name, role]
      properties:
        user_id: { $ref: "#/components/schemas/Id" }
        username: { type: string }
        display_name: { type: string }
        role: { $ref: "#/components/schemas/Role" }

    # ---------- 配置 ----------
    Cultivar:
      type: object
      required: [cultivar_id, name, is_active, version]
      properties:
        cultivar_id: { type: string }
        name: { type: string }
        is_active: { type: boolean }
        version: { type: integer }
        created_at: { type: string, format: date-time }
