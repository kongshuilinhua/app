    # ---------- 审计 ----------
    AuditRow:
      type: object
      required: [audit_id, at, actor_id, actor_display_name, actor_role, action, object_type, object_id, request_id]
      properties:
        audit_id: { $ref: "#/components/schemas/Id" }
        at: { type: string, format: date-time }
        actor_id: { type: [string, "null"], format: uuid }
        actor_display_name: { type: [string, "null"] }
        actor_role: { type: [string, "null"] }
        action: { type: string }
        object_type: { type: string }
        object_id: { type: string }
        before_json: { type: [object, "null"] }
        after_json: { type: [object, "null"] }
        request_id: { type: [string, "null"], format: uuid }
        ip: { type: [string, "null"] }
        user_agent: { type: [string, "null"] }
    AuditPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditRow" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    # ---------- 专家工单（F2） ----------
    TicketActionRequest:
      type: object
      required: [expected_version]
      properties:
        expected_version: { type: integer }
    TicketDraftRequest:
      type: object
      required: [expected_version, draft]
      properties:
        expected_version: { type: integer }
        draft: { type: string, maxLength: 5000 }
    TicketRequestInfoRequest:
      type: object
      required: [expected_version, request_text]
      properties:
        expected_version: { type: integer }
        request_text: { type: string, maxLength: 2000 }
    TicketAnswerRequest:
      type: object
      required: [expected_version, answer_text]
      properties:
        expected_version: { type: integer }
        answer_text: { type: string, maxLength: 5000 }
    TicketUnresolveRequest:
      type: object
      required: [expected_version, reason]
      properties:
        expected_version: { type: integer }
        reason: { type: string, maxLength: 2000 }
    TicketEvent:
      type: object
      required: [event_id, action, actor_display_name, at, version]
      properties:
        event_id: { $ref: "#/components/schemas/Id" }
        action: { type: string, enum: [create, claim, save_draft, request_info, answer, unresolve, reopen] }
        actor_display_name: { type: [string, "null"] }
        at: { type: string, format: date-time }
        version: { type: integer }
        payload: { type: [object, "null"] }
    TicketSummary:
      type: object
      required: [ticket_id, question_id, status, outcome, assignee_id, assignee_display_name, version, created_at, updated_at, question_text, question_status]
      properties:
        ticket_id: { $ref: "#/components/schemas/Id" }
        question_id: { $ref: "#/components/schemas/Id" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        outcome: { type: [string, "null"] }
        assignee_id: { type: [string, "null"], format: uuid }
        assignee_display_name: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        question_text: { type: [string, "null"] }
        question_status: { $ref: "#/components/schemas/QuestionStatus" }
    TicketSummaryPage:
      type: object
      required: [items, page, page_size, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/TicketSummary" }
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }
    TicketDetail:
      type: object
      required: [ticket_id, question_id, status, outcome, draft, version, created_at, updated_at, claimed_at, closed_at, question, events]
      properties:
        ticket_id: { $ref: "#/components/schemas/Id" }
        question_id: { $ref: "#/components/schemas/Id" }
        status: { $ref: "#/components/schemas/TicketStatus" }
        outcome: { type: [string, "null"] }
        assignee_id: { type: [string, "null"], format: uuid }
        assignee_display_name: { type: [string, "null"] }
        draft: { type: [string, "null"] }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        claimed_at: { type: [string, "null"], format: date-time }
        closed_at: { type: [string, "null"], format: date-time }
        question:
          type: object
          required: [question_id, text, status, current_version, created_at, last_event_at, attachments, supplements]
          properties:
            question_id: { $ref: "#/components/schemas/Id" }
            text: { type: [string, "null"] }
            status: { $ref: "#/components/schemas/QuestionStatus" }
            current_version: { type: integer }
            created_at: { type: string, format: date-time }
            last_event_at: { type: string, format: date-time }
            attachments:
              type: array
              items:
                type: object
                required: [attachment_id, mime_type, width, height, uploaded_at]
                properties:
                  attachment_id: { $ref: "#/components/schemas/Id" }
                  mime_type: { type: string }
                  width: { type: integer }
                  height: { type: integer }
                  uploaded_at: { type: string, format: date-time }
            supplements:
              type: array
              items:
                type: object
                required: [supplement_id, author_display_name, text, question_version, created_at]
                properties:
                  supplement_id: { $ref: "#/components/schemas/Id" }
                  author_display_name: { type: string }
                  text: { type: [string, "null"] }
                  question_version: { type: integer }
                  created_at: { type: string, format: date-time }
        events:
          type: array
          items: { $ref: "#/components/schemas/TicketEvent" }
