openapi: 3.1.0
info:
  title: 柑橘病虫害采集管理端 API
  version: "2.0.0"
  description: |
    采集→上传→审核→导出的管理端契约。基础路径 `/api/v1`，认证 `Authorization: Bearer <access_token>`。
    字段、枚举和错误码以本契约及 enums.yaml 为准。
    2.0.0 起移除果园实体、果园字典接口与按果园的数据范围；expert/admin/super_admin 可见全部样本；collector 仅可读本人记录。
    专业核验限 expert/super_admin；训练质量、排除/恢复与导出限 admin/super_admin。
  x-contract-version: "2.0.0"
servers:
  - url: /api/v1
    description: 同源 `/api` 转发（开发与生产一致）

security:
  - bearerAuth: []

tags:
  - name: auth
    description: 登录、刷新、退出与当前账号
  - name: config
    description: 基础配置与字典 bootstrap
  - name: samples
    description: 样本列表、详情、审核、排除/恢复
  - name: uploads
    description: 采集端四步上传（声明→逐图字节→查缺图→完成）
  - name: media
    description: 鉴权媒体访问
  - name: exports
    description: 导出批次
  - name: dictionaries
    description: 品种/类别字典与 CSV 导入
  - name: users
    description: 账号管理
  - name: audit
    description: 审计
  - name: health
    description: 健康检查
  - name: expert-tickets
    description: 专家工单（F2 / M2）

paths:
  /diagnoses:
    post:
      tags:
      - diagnosis
      summary: Diagnose
      operationId: diagnose_api_v1_diagnoses_post
      parameters:
      - name: crop_id
        in: query
        required: false
        schema:
          enum:
          - huyou
          - xiangyou
          - citrus
          type: string
          default: huyou
          title: Crop Id
      - name: part
        in: query
        required: false
        schema:
          enum:
          - leaf
          - fruit
          - branch
          type: string
          default: leaf
          title: Part
      - name: tree_age
        in: query
        required: false
        schema:
          enum:
          - adult
          - young
          - unknown
          type: string
          default: unknown
          title: Tree Age
      - name: X-Image-ID
        in: header
        required: true
        schema:
          type: string
          title: X-Image-Id
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiagnosisOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 认证、校验、服务容量或模型不可用错误
        '403':
          description: 认证、校验、服务容量或模型不可用错误
        '429':
          description: 认证、校验、服务容量或模型不可用错误
        '503':
          description: 认证、校验、服务容量或模型不可用错误
      requestBody:
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
          image/webp:
            schema:
              type: string
              format: binary
      security:
      - bearerAuth: []
  /diagnoses/advice:
    post:
      tags:
      - diagnosis
      summary: Retry Advice
      operationId: retry_advice_api_v1_diagnoses_advice_post
      parameters:
      - name: authorization
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Authorization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetryIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Advice'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 认证、校验、服务容量或模型不可用错误
        '403':
          description: 认证、校验、服务容量或模型不可用错误
        '429':
          description: 认证、校验、服务容量或模型不可用错误
        '503':
          description: 认证、校验、服务容量或模型不可用错误
      security:
      - bearerAuth: []
  /recognitions:
    post:
      tags: [recognition]
      operationId: recognizeSingleImage
      summary: 单张图片识别，返回待人工确认的候选
      description: 仅采集账号可调用；最大20MiB、2400万像素、单并发。模型未配置返回503，不生成模拟结果。不创建采集记录、不自动写入类别。
      parameters:
        - name: X-Image-ID
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          image/jpeg: { schema: { type: string, format: binary } }
          image/png: { schema: { type: string, format: binary } }
          image/webp: { schema: { type: string, format: binary } }
      responses:
        '200':
          description: 当前图片的真实模型候选，需人工复核
          content:
            application/json:
              schema:
                type: object
                required: [image_id, sha256, model, model_version, scope, candidates, warning, created_at]
                properties:
                  image_id: { type: string, format: uuid }
                  sha256: { type: string }
                  model: { type: string }
                  model_version: { type: string }
                  scope: { type: string }
                  warning: { type: string }
                  created_at: { type: string, format: date-time }
                  candidates:
                    type: array
                    minItems: 1
                    maxItems: 5
                    items:
                      type: object
                      required: [label, name, score]
                      properties:
                        label: { type: string }
                        name: { type: string }
                        score: { type: number, minimum: 0, maximum: 1 }
                        class_id: { type: [string, 'null'] }
        '413': { description: 图片字节或像素超限 }
        '415': { description: 图片不支持或解码失败 }
        '429': { description: 识别服务繁忙 }
        '503': { description: 模型未配置或暂时不可用 }
  /samples/{sample_id}/withdraw:
    post:
      tags: [samples]
      summary: 采集人撤回本人已上传记录（幂等）
      operationId: withdrawSample
      description: 撤回后不再进入审核和新导出；已创建的历史导出快照保留。重新提交须使用新的样本和图片ID。
      parameters:
        - name: sample_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 已撤回（重复请求返回相同结果）
          content:
            application/json:
              schema:
                type: object
                required: [sample_id, state]
                properties:
                  sample_id: { type: string, format: uuid }
                  state: { type: string, enum: [withdrawn] }
        '404': { description: 记录不存在或不属于当前采集人 }
        '409': { description: 记录尚未上传完成 }
  # ---------------- 健康 ----------------
  /health:
    get:
      tags: [health]
      operationId: health
      security: []
      summary: 进程存活
      responses:
        "200":
          description: 存活
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
  /health/ready:
    get:
      tags: [health]
      operationId: healthReady
      security: []
      summary: 依赖就绪
      responses:
        "200":
          description: 就绪
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthResponse" }
        "503":
          $ref: "#/components/responses/Unavailable"

  # ---------------- 认证 ----------------
  /auth/phone/code:
    post:
      tags: [auth]
      operationId: sendPhoneCode
      security: []
      summary: 发送手机登录验证码
      description: 每手机号60秒重发，验证码5分钟有效。发送有全局、IP和手机号配额。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneCodeRequest" }
      responses:
        "200":
          description: 发送请求已受理，不返回验证码
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PhoneCodeResponse" }
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
  /auth/phone/login:
    post:
      tags: [auth]
      operationId: phoneLogin
      security: []
      summary: 手机验证码登录，首次验证后自动创建账号
      description: 首次验证成功创建collector，再次登录使用同一用户ID。验证码一次性，最多5次尝试。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PhoneLoginRequest" }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          $ref: "#/components/responses/AuthInvalid"
        "403":
          description: 账号已停用
        "409":
          description: 并发登录发生冲突，请重试
        "503":
          $ref: "#/components/responses/Unavailable"
  /me/profile:
    get:
      tags: [auth]
      operationId: getMyProfile
      summary: 当前用户个人资料
      responses:
        "200":
          description: 当前账号资料，手机号仅返回脱敏信息
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileResponse" }
        "401":
          $ref: "#/components/responses/AuthInvalid"
    patch:
      tags: [auth]
      operationId: patchMyProfile
      summary: 修改当前用户昵称
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfilePatch" }
      responses:
        "200":
          description: 昵称已保存，用户标识和角色保持不变
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileResponse" }
        "401":
          $ref: "#/components/responses/AuthInvalid"
        "422":
          description: 昵称不合法或包含不可修改的字段
  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      summary: 账号密码登录
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            examples:
              admin:
                value: { username: "admin", password: "12345678" }
      responses:
        "200":
          description: 登录成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginResponse" }
        "401":
          $ref: "#/components/responses/AuthInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      security: []
      summary: 轮换刷新令牌
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: 刷新成功，原子替换令牌
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RefreshResponse" }
        "401":
          $ref: "#/components/responses/AuthInvalid"
  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: 撤销当前刷新令牌
      responses:
        "204":
          description: 已退出
  /me:
    get:
      tags: [auth]
      operationId: getMe
      summary: 当前账号
      responses:
        "200":
          description: 当前账号
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401":
          $ref: "#/components/responses/AuthRequired"

  # ---------------- 配置 ----------------
  /config/bootstrap:
    get:
      tags: [config]
      operationId: getBootstrap
      summary: 品种/类别与版本
      responses:
        "200":
          description: 基础配置
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BootstrapResponse" }

  # ---------------- 样本 ----------------
  /batches:
    get:
      operationId: listBatches
      summary: 采集员仅本人，其他管理角色可查看批次
      tags: [batches]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BatchPage"}
        "401": {$ref: "#/components/responses/AuthRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /batches/{batch_id}:
    put:
      operationId: putBatch
      summary: 创建或编辑本人批次，跨账号 ID 返回 404
      tags: [batches]
      parameters:
        - {name: batch_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/BatchInput"}
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Batch"}
        "401": {$ref: "#/components/responses/AuthRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /questions:
    get:
      operationId: listCollectionQuestions
      summary: 采集员仅本人，expert/super_admin 可查看全部咨询
      tags: [questions]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 20}}
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CollectionQuestionPage"}
        "401": {$ref: "#/components/responses/AuthRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
    post:
      operationId: createCollectionQuestion
      summary: 本人已上传样本可附图；同 ID 同内容幂等，异内容 409
      tags: [questions]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CollectionQuestionInput"}
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CollectionQuestion"}
        "201":
          description: 已创建
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CollectionQuestion"}
        "401": {$ref: "#/components/responses/AuthRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /questions/{question_id}:
    get:
      operationId: getCollectionQuestion
      summary: 咨询详情与鉴权图片链接
      tags: [questions]
      parameters:
        - {name: question_id, in: path, required: true, schema: {type: string}}
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CollectionQuestion"}
        "401": {$ref: "#/components/responses/AuthRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /questions/{question_id}/answer:
    patch:
      operationId: answerCollectionQuestion
      summary: 仅 expert/super_admin 写入真实答复
      tags: [questions]
      parameters:
        - {name: question_id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CollectionAnswerInput"}
      responses:
        "200":
          description: 成功
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CollectionQuestion"}
        "401": {$ref: "#/components/responses/AuthRequired"}
        "403": {$ref: "#/components/responses/Forbidden"}
        "404": {$ref: "#/components/responses/NotFound"}
        "409": {$ref: "#/components/responses/StateConflict"}
        "422": {$ref: "#/components/responses/ValidationFailed"}
  /samples:
    get:
      tags: [samples]
      operationId: listSamples
      summary: 样本列表（分页、筛选）
      description: 采集人员仅查询本人，expert/admin/super_admin 查询全部；范围在分页前确定。
      parameters:
        - {name: batch_id, in: query, schema: {type: string}}
        - { $ref: "#/components/parameters/UploadState" }
        - { $ref: "#/components/parameters/ReviewStatus" }
        - { $ref: "#/components/parameters/Excluded" }
        - { $ref: "#/components/parameters/FinalCultivarId" }
        - { $ref: "#/components/parameters/FinalClassId" }
        - { $ref: "#/components/parameters/UploadedFrom" }
        - { $ref: "#/components/parameters/UploadedTo" }
        - { $ref: "#/components/parameters/SampleQ" }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/PageSize" }
      responses:
        "200":
          description: 样本列表
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleSummaryPage" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /samples/{sample_id}:
    get:
      tags: [samples]
      operationId: getSample
      summary: 样本详情
      description: 采集人员仅可读本人，expert/admin/super_admin 可读全部；无权访问的采集记录返回 404。
      parameters:
        - { $ref: "#/components/parameters/SampleId" }
      responses:
        "200":
          description: 样本详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleDetail" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /samples/{sample_id}/review:
    patch:
      tags: [samples]
      operationId: reviewSample
      summary: 保存对象审核
      description: 仅 expert/super_admin 可保存专业核验结论；admin 无此写权限。
      parameters:
        - { $ref: "#/components/parameters/SampleId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SampleReviewRequest" }
      responses:
        "200":
          description: 最新样本详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleDetail" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionOrStateConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /samples/{sample_id}/images/{image_id}/quality:
    patch:
      tags: [samples]
      operationId: setImageQuality
      summary: 单图质量
      description: 仅 admin/super_admin；样本须已 confirmed/corrected，否则返回 409 STATE_CONFLICT。
      parameters:
        - { $ref: "#/components/parameters/SampleId" }
        - { $ref: "#/components/parameters/ImageId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImageQualityRequest" }
      responses:
        "200":
          description: 该图最新质量值
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleImage" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionOrStateConflict" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
  /samples/{sample_id}/exclude:
    post:
      tags: [samples]
      operationId: excludeSample
      summary: 排除样本
      description: 仅 admin/super_admin；排除训练使用，保留采集记录。
      parameters:
        - { $ref: "#/components/parameters/SampleId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ExcludeRequest" }
      responses:
        "200":
          description: 最新样本详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleDetail" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionOrStateConflict" }
  /samples/{sample_id}/restore:
    post:
      tags: [samples]
      operationId: restoreSample
      summary: 恢复样本
      description: 仅 admin/super_admin；恢复训练候选资格，仍须满足核验与质量条件。
      parameters:
        - { $ref: "#/components/parameters/SampleId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestoreRequest" }
      responses:
        "200":
          description: 最新样本详情
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SampleDetail" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/VersionOrStateConflict" }

  # ---------------- 采集上传（四步协议） ----------------
  /uploads:
    post:
      tags: [uploads]
      operationId: declareUpload
      summary: 声明样本与固定图片清单（第 1 步）
      description: |
        客户端生成 `sample_id`/`image_id`（UUIDv7）并一次声明完整清单；无果园或组织范围。
        首次声明即固定清单：同 `sample_id` 且规范化内容相同返回 200 重放同一 `upload_id`；内容不同返回 409 `IDEMPOTENCY_CONFLICT`。
        不支持“未收到任何图之前整份替换声明”，要改清单须换新的 `sample_id`（无修订声明接口）。
        规范化比较保留 `captured_at`、`sha256`、`file_size` 等全部采集字段，只排除请求头、请求 ID 等服务端传输信息；统一时间表示与字段默认值，键排序、图片按 `image_id` 排序后比较。
        限制：1–12 图，单图 ≤20MiB，合计 ≤120MiB，声明体 ≤64KiB；未知字段一律拒绝。
        权限：仅 `collector` 可声明，owner 为当前账号；`admin`/`super_admin` 不代采集，通过 `/samples` 与 `/media` 处理已完整接收的样本。
        服务端尚未实现的运行期规则（image_id 唯一、清单合计大小、规范化内容比较）由实现校验，本契约只描述不重复表达。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UploadDeclareRequest" }
            examples:
              two_images:
                summary: 两图样本声明
                value:
                  sample_id: "0199a1f0-7c3e-7b1a-9d2f-2a5c8e1b4d60"
                  schema_version: 1
                  tree_id: "T-001"
                  cultivar_id: "huyou"
                  part: "leaf"
                  class_id: "unknown"
                  symptoms: "叶片出现黄斑"
                  note: null
                  images:
                    - image_id: "0199a1f1-1d2c-7c33-8a44-6f7b8c9d0e11"
                      view_type: "close_up"
                      captured_at: "2026-10-20T09:12:33+08:00"
                      device_timezone: "Asia/Shanghai"
                      device_model: "Pixel 8"
                      mime_type: "image/jpeg"
                      width: 3000
                      height: 4000
                      file_size: 1843200
                      sha256: "3f786850e387550fdab836ed7e6dc881de23001b1f9b0d8ff1b1b3ce5b6b0f0f"
                    - image_id: "0199a1f1-2a45-7d10-9b6c-3d4e5f607182"
                      view_type: "context"
                      captured_at: "2026-10-20T09:13:05+08:00"
                      device_timezone: "Asia/Shanghai"
                      device_model: null
                      mime_type: "image/jpeg"
                      width: 4000
                      height: 3000
                      file_size: 902144
                      sha256: "9c1185a5c5e9fc54612808977ee8f548b2258d31ddad0d0b4f0a4b7e2c9d1c4a"
      responses:
        "201":
          description: 新建上传会话；返回完整 UploadStatus（state=receiving）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadStatus" }
              examples:
                created:
                  summary: 刚声明、尚未收到任何字节
                  value:
                    upload_id: "0199a1f2-3b4c-7d5e-8f60-718293a4b5c6"
                    sample_id: "0199a1f0-7c3e-7b1a-9d2f-2a5c8e1b4d60"
                    state: "receiving"
                    declared_at: "2026-10-20T01:20:02Z"
                    received_images: []
                    missing_images:
                      - "0199a1f1-1d2c-7c33-8a44-6f7b8c9d0e11"
                      - "0199a1f1-2a45-7d10-9b6c-3d4e5f607182"
                    invalid_images: []
        "200":
          description: 同 sample_id 同规范化内容的重放；返回同一 upload_id 的完整 UploadStatus，已接收图片不变
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadStatus" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/IdempotencyConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /uploads/{upload_id}:
    get:
      tags: [uploads]
      operationId: getUploadStatus
      summary: 查询上传状态与缺图清单（第 3 步）
      description: |
        断线重连后的恢复入口：`received_images`/`missing_images`/`invalid_images` 三个集合互斥，并集等于声明清单（按声明顺序），
        客户端只补传 `missing` 与 `invalid` 中的 `image_id`，不必整包重传，也不必依赖本地回执。
        权限：仅声明该会话的 `collector` 本人；其他 `collector` 返回 404 `NOT_FOUND`（不泄露存在性），`admin`/`super_admin` 等非采集角色返回 403 `FORBIDDEN`。
      parameters:
        - { $ref: "#/components/parameters/UploadId" }
      responses:
        "200":
          description: 当前上传状态；complete 后仍可读取（图片集合全部为 received）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadStatus" }
              examples:
                receiving:
                  summary: 收到一图、缺一图
                  value:
                    upload_id: "0199a1f2-3b4c-7d5e-8f60-718293a4b5c6"
                    sample_id: "0199a1f0-7c3e-7b1a-9d2f-2a5c8e1b4d60"
                    state: "receiving"
                    declared_at: "2026-10-20T01:20:02Z"
                    received_images:
                      - "0199a1f1-1d2c-7c33-8a44-6f7b8c9d0e11"
                    missing_images:
                      - "0199a1f1-2a45-7d10-9b6c-3d4e5f607182"
                    invalid_images: []
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /uploads/{upload_id}/images/{image_id}:
    put:
      tags: [uploads]
      operationId: uploadImageBytes
      summary: 逐图上传原始字节（第 2 步）
      description: |
        请求体即原始图片字节，不重编码、不打包；`Content-Type`、`Content-Length`、`X-Content-SHA256` 必填，
        且必须与声明中该图的 `mime_type`/`file_size`/`sha256` 一致。
        首次接收 201；同一 `image_id` 相同字节重复 PUT 返回 200 重放（不重复计数）；该 `image_id` 已接收的字节与本次不同返回 409 `FILE_MISMATCH`。
        `image_id` 不在声明清单内、或 upload 已 complete 后继续写入，返回 409 `STATE_CONFLICT`；完成后拒绝新字节。
        服务端按真实字节长度、SHA256、文件签名与可解码尺寸核对，不信任头部声明；原图哈希与方向元数据保留。
        上传成功只代表字节完整，图片人工质量仍为 `pending`；`receive_status` 不等于 `quality_status`。
        权限：仅该上传的 `collector` owner；其他 `collector` 按 404 `NOT_FOUND` 处理，`admin`/`super_admin` 等非采集角色返回 403 `FORBIDDEN`。
      parameters:
        - { $ref: "#/components/parameters/UploadId" }
        - { $ref: "#/components/parameters/ImageId" }
        - { $ref: "#/components/parameters/ContentSha256" }
        - { $ref: "#/components/parameters/ContentLength" }
      requestBody:
        required: true
        description: 原始图片字节；只接受 JPEG/PNG/WebP，Content-Type 必须是其中之一
        content:
          image/jpeg:
            schema: { type: string, format: binary }
          image/png:
            schema: { type: string, format: binary }
          image/webp:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: 首次接收成功
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadImageReceipt" }
              examples:
                received:
                  value:
                    upload_id: "0199a1f2-3b4c-7d5e-8f60-718293a4b5c6"
                    image_id: "0199a1f1-1d2c-7c33-8a44-6f7b8c9d0e11"
                    receive_status: "received"
                    sha256: "3f786850e387550fdab836ed7e6dc881de23001b1f9b0d8ff1b1b3ce5b6b0f0f"
                    file_size: 1843200
        "200":
          description: 相同字节重放；返回同一收据，不改变已存字节
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadImageReceipt" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/FileMismatch" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMedia" }
        "422": { $ref: "#/components/responses/ValidationFailed" }
        "429": { $ref: "#/components/responses/RateLimited" }
  /uploads/{upload_id}/complete:
    post:
      tags: [uploads]
      operationId: completeUpload
      summary: 确认接收完成（第 4 步）
      description: |
        无请求体。仅当声明清单内全部图片 `received` 时成功；存在缺图或无效图返回 409 `MISSING_IMAGES`
        （`details.missing`/`details.invalid` 列出 image_id），且不产生完成回执。
        重复 complete 幂等成功，`upload_completed_at` 保持首次完成时间，不重复创建样本、不重复出现在列表。
        完成后样本 `upload_state=complete` 进入默认审核列表；上传接口后续拒绝新字节。
        权限：仅该上传的 `collector` owner；其他 `collector` 按 404 `NOT_FOUND` 处理，`admin`/`super_admin` 等非采集角色返回 403 `FORBIDDEN`。
      parameters:
        - { $ref: "#/components/parameters/UploadId" }
      responses:
        "200":
          description: 完成回执（首次或重放，完成时间不变）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UploadCompleteResponse" }
              examples:
                completed:
                  value:
                    upload_id: "0199a1f2-3b4c-7d5e-8f60-718293a4b5c6"
                    sample_id: "0199a1f0-7c3e-7b1a-9d2f-2a5c8e1b4d60"
                    state: "complete"
                    upload_completed_at: "2026-10-20T01:22:10Z"
                    image_count: 2
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/MissingImages" }

