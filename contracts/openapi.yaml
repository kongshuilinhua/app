              schema: { type: string }
          content:
            application/zip: {}
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
  /exports/{export_id}/retry:
    post:
      tags: [exports]
      operationId: retryExport
      summary: 失败批次按原快照重试
      description: 单API进程有界执行；忙或超过账号频率返回429及Retry-After，同键重放不重复占用配额。默认同时1批、每账号每分钟6批、单批5000图且ZIP不超过1GiB，超范围413。
      parameters:
        - { $ref: "#/components/parameters/ExportId" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "202":
          description: 已重新入队
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportJob" }
        "401": { $ref: "#/components/responses/AuthRequired" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/StateConflict" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "429": { $ref: "#/components/responses/RateLimited" }

